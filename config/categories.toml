# Step 6: the categories (docs/CATEGORIES.md). scripts/categorise.py reads it.
# Every lecture gets one level on each axis: corpus and text_source as they are in the
# attributes table, the four tercile axes below, tables, discipline.

[text_source]
# The per-lecture text source of the attributes table (so the one scanned MaViLS deck is
# tesseract_ocr). Any other value stops the run.
levels = ["pdf_text_layer", "corpus_corrected_ocr", "tesseract_ocr"]

# Tercile axes: the cut points q1, q2 are computed once over all lectures pooled (the
# values at the 1/3 and 2/3 positions of the sorted values); level 1 if value <= q1,
# level 2 if q1 < value <= q2, level 3 otherwise. The axis name is the output column.
[terciles.length]
column = "n_slides"
levels = ["short", "medium", "long"]

[terciles.images]
column = "image_pct"
levels = ["low", "medium", "high"]

[terciles.noise]
column = "noise"
levels = ["low", "medium", "high"]

[terciles.text_density]
column = "text_density"
levels = ["low", "medium", "high"]

[tables]
# none if the column is 0, some if it is > 0.
column = "table_pct"

[discipline]
fos_list = "config/oecd_fos2007.csv"
# Second-level field codes that are levels of their own; the other fields of their area
# become "<area> (other)". 1.2 Computer and information sciences: 742 of the 919 Natural
# sciences lectures, so the area alone would mostly measure that one field.
own_level = ["1.2"]
# A level with fewer lectures than this is merged into "other".
min_count = 20

[discipline.areas]
# The broad OECD FOS 2007 areas, keyed by the first digit of the field code.
"1" = "Natural sciences"
"2" = "Engineering and technology"
"3" = "Medical and health sciences"
"4" = "Agricultural sciences"
"5" = "Social sciences"
"6" = "Humanities"
