# The weights of the three local-model scorers (splade, cross_encoder, image), read by
# scripts/build_similarity.py (step 10). Not part of config/similarity.toml: that file
# holds the settings that decide the numbers, and its sections must be exactly the ones
# similarity/registry.py knows. A scorer's `model` there stays the Hugging Face name, so
# the cache keys do not depend on where the files lie; the build loads them from here.
#
# Each model is pinned to one commit of its Hugging Face repository and every file is
# checked by sha256 (`python scripts/build_similarity.py fetch`). The files live outside
# the repository in $PROJECT_ROOT/models_lsab/ (the shared hf_cache is not used); `dir` is
# relative to PROJECT_ROOT (scripts/project_root.py).

dir = "models_lsab"

