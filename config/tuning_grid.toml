# The tuning grid of step 11: every method's values to try, exactly as in
# docs/TUNING_DESIGN.md (sections 1-3; the counts are its section 5.1 table, checked by
# tests/test_tuning.py). scripts/tune.py runs every combination on each of the 60
# tuning lectures; scripts/select_settings.py chooses one per method.
#
# Per method:
#   stage     "matrix"    non-LLM base method (array jobs, any order)
#             "llm"       LLM base method (the one LLM process, in this file's order)
#             "consensus" tuned after its members, at their tuned settings
#   measure   the similarity measures tried. "none": the method does not read the
#             matrix (hierarchical; it gets the hybrid table for its shape only).
#             "members": no measure of its own, each member reads its own tuned one.
#   model     the LLM (LLM methods that make their own calls). Decided
#             2026-10-12: one model only, qwen3-30b-a3b-instruct-2507
#             (glm-5.3-flash and qwen3.5-397b-a17b dropped), so the model is a fixed
#             value, not a tuned setting; it stays in the grid as part of each
#             combination's identity
#   [m.cfg]   the DPConfig fields tuned for the method (the others stay at DPConfig's
#             defaults; `standardize` is fixed at true)
#   [m.settings]  the method's own settings tuned; every other setting stays at the
#             method's default (the fixed values and their reasons are in the design)
#
# The combinations are the product of model, measure, cfg and settings, in this order
# and in the order the values are written. TOML has no null: the string "none" in a
# settings list stands for Python's None (mbr's `temperature`).

[argmax]
stage = "matrix"
measure = ["bm25", "embed", "splade", "cross_encoder", "image", "hybrid", "hybrid_splade", "hybrid_image"]

