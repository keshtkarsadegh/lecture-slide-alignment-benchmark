# ---------------------------------------------------------------- LLM base methods
# (run in this order; hierarchical's refinement "on" before "off", so "off" is all
# cache hits; their measure is fixed at hybrid: it is read only for the fallback)

[llm_single_call]
stage = "llm"
measure = ["hybrid"]
model = ["qwen3-30b-a3b-instruct-2507"]

[llm_monotone]
stage = "llm"
measure = ["hybrid"]
model = ["qwen3-30b-a3b-instruct-2507"]

[llm_monotone_constrained]
stage = "llm"
measure = ["hybrid"]
model = ["qwen3-30b-a3b-instruct-2507"]

[hierarchical]
stage = "llm"
measure = ["none"]
model = ["qwen3-30b-a3b-instruct-2507"]
[hierarchical.settings]
leaf_max_pages = [3, 5]
use_boundary_refinement = [true, false]

# ---------------------------------------------------------------- after their members
# (members at their tuned settings and measures, config/tuned_settings.toml)

[score_fusion]                     # members: softdtw, cohesion_dp, needleman_wunsch
stage = "consensus"
measure = ["members"]
[score_fusion.settings]
nw_gamma = [0.1, 0.3, 1.0]

[ensemble]                         # voters: dp, dtw, needleman_wunsch, cohesion_dp, pelt
stage = "consensus"                # and llm_single_call (the one model)
measure = ["members"]
[ensemble.settings]
smooth = [true, false]

[llm_rerank_kbest]                 # candidates: dtw, dp, pelt, needleman_wunsch, cohesion_dp
stage = "consensus"
measure = ["members"]
model = ["qwen3-30b-a3b-instruct-2507"]

[fusion]                           # hierarchical at its tuned settings
stage = "consensus"
measure = ["bm25", "embed", "splade", "cross_encoder", "image", "hybrid", "hybrid_splade", "hybrid_image"]
model = ["qwen3-30b-a3b-instruct-2507"]
[fusion.cfg]
